[package]
name = "ratriyx"
version = "0.3.0"
edition = "2021"
description = "Cross-platform per-process privacy routing through Tor and Privoxy"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/rickyreza12/ratriyx"
homepage = "https://github.com/rickyreza12/ratriyx"
readme = "README.md"
keywords = ["tor", "proxy", "privacy", "cli", "network"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]

[target.'cfg(windows)'.dependencies]
ratatui = "=0.29.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Rpc", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_JobObjects", "Win32_System_Threading"] }
